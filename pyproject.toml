[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tododolist-bridge"
version = "1.0.0"
description = "Move open Google Tasks into the Todoist Inbox safely."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.5,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2.2,<2",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
tododolist = "tododolist.cli:main"

[tool.setuptools.packages.find]
include = ["tododolist*"]

[tool.ruff]
line-length = 100
target-version = "py311"
